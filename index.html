<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff4e9">
  <title>温故 · Ella 的猫咪小屋</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cat-club.css">
</head>
<body>
  <header class="header">
    <a class="brand" href="#today" aria-label="温故首页"><span class="brand-mark" aria-hidden="true">🐾</span><span>温故 · 猫咪小屋<span class="brand-en">ELLA’S KITTY CLUB</span></span></a>
    <nav aria-label="主导航">
      <button data-page="today" class="nav active">🐾 今日练习</button>
      <button data-page="collection" class="nav">猫咪图鉴</button>
      <button data-page="library" data-parent-entry class="nav">家长空间</button>
    </nav>
    <div class="header-note">小小的爪爪，大大的鼓励 ♡</div>
  </header>
  <nav id="parent-nav" class="parent-nav hidden" aria-label="家长端导航">
    <button data-page="library" class="nav">家长题库</button>
    <button data-page="courses" class="nav">课程进度</button>
    <button data-page="progress" class="nav">复习记录</button>
  </nav>
  <main id="app"></main>
  <footer><span>🐾 温故 · 和小猫咪一起，慢慢进步</span><span>本机随时保存 · 绑定账号后跨设备同步</span></footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog">
    <h2 id="confirm-title"></h2><p id="confirm-text"></p>
    <div class="actions"><button id="confirm-cancel" class="button secondary">取消</button><button id="confirm-ok" class="button">确认</button></div>
  </dialog>
  <dialog id="cat-dialog" aria-labelledby="cat-dialog-title"></dialog>
  <dialog id="account-dialog" aria-labelledby="account-title"></dialog>
  <script src="bank.js"></script>
  <script src="cat-catalog.js"></script>
  <script src="rewards.js"></script>
  <script src="engine.js"></script>
  <script src="storage.js"></script>
  <script src="learning-sync.js"></script>
  <script src="account-state.js"></script>
  <script src="account-sync.js"></script>
  <script src="version.js"></script>
  <script src="audio-manifest.js"></script>
  <script src="audio-player.js"></script>
  <script src="feedback-config.js"></script>
  <script src="error-feedback.js"></script>
  <script src="app.js"></script>
</body>
</html>
