<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#315ee8">
  <title>温故 · 英语复习小站</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a class="brand" href="#today" aria-label="温故首页"><span class="brand-mark"><svg viewBox="0 0 32 32" width="29" height="29" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M26 12a11 11 0 1 0 1 9"/><path d="M19 12h7V5"/></svg></span><span>温故<span class="brand-en">LESSON LOOP</span></span></a>
    <nav aria-label="主导航">
      <button data-page="today" class="nav active">学生端 · 今日复习</button>
      <button data-page="library" data-parent-entry class="nav">家长端</button>
    </nav>
    <div class="header-note"><span class="dot"></span>每天一点，记得更久</div>
  </header>
  <nav id="parent-nav" class="parent-nav hidden" aria-label="家长端导航">
    <button data-page="library" class="nav">家长题库</button>
    <button data-page="courses" class="nav">课程进度</button>
    <button data-page="progress" class="nav">复习记录</button>
  </nav>
  <main id="app"></main>
  <footer><span>温故 · 跟着课程，一起慢慢进步</span><span>学习记录保存在当前浏览器 · 可在家长题库中备份</span></footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog">
    <h2 id="confirm-title"></h2><p id="confirm-text"></p>
    <div class="actions"><button id="confirm-cancel" class="button secondary">取消</button><button id="confirm-ok" class="button">确认</button></div>
  </dialog>
  <script src="bank.js"></script>
  <script src="engine.js"></script>
  <script src="storage.js"></script>
  <script src="version.js"></script>
  <script src="app.js"></script>
</body>
</html>
